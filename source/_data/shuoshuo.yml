  date: 2026-06-08 01:35:00
  key: 6-the-hexgram
  content: |
    起了一卦。
    上乾下坎，天水讼。
    有孚，窒惕，中吉，终凶。利见大人，不利涉大川。
    初六。不永所事，小有言，终吉。
    象曰：不永所事，讼不可长也；虽小有言，其辨明也，
    《焦氏易林》：
    大有之讼。虎卧山隅，鹿过后朐。弓矢设张，猬为功曹。伏不敢起，逐至平野，得我美草。
    讼之履。树植藿豆，不得芸锄。王事无盬，秋无所收。
