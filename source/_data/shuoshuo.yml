  content: |
    Казни сына своего от юности его и не ослабей бия младенца; аще бо жезлом биеши его, то не умрёт, но здравее будет; ты бо бия его по телу, душу его избавляеши от смерти.
    *----"Домострой"*
    趁儿子年幼，就应管教，不可姑息；你用杖责打他，他必不致死，反得更康健。你责打他的身体，却是救他的灵魂免于死亡。 
    *——《治家格言》*
